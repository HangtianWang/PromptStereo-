model:
  name: PromptStereo
  train_iters: 16
  valid_iters: 32
  instance:
    _target_: model.promptstereo.PromptStereo
    cfg:
      feat_dim:
      - 64
      - 128
      - 192
      - 256
      stem_dim:
      - 32
      - 64
      - 128
      - 192
      - 256
      gwc_max_disp: 192
      gwc_group: 8
      corr_level: 2
      corr_radius: 4
      n_downsample: 2
      pretrained_model:
        name: DepthAnythingV2
        checkpoint: /data/wxq/checkpoint/depth_anything_v2/depth_anything_v2_vitl.pth
        features: 256
        out_channels:
        - 256
        - 512
        - 1024
        - 1024
        use_bn: false
        instance:
          _target_: model.depth_anything_v2.DepthAnythingV2
          encoder: vitl
          features: ${..features}
          out_channels: ${..out_channels}
          use_bn: false
          use_clstoken: false
gpus: ${oc.env:CUDA_VISIBLE_DEVICES, '0,1,2,3'}
checkpoint: /data/wxq/checkpoint/promptstereo-v6/exp14-aug-init/final/model.safetensors
accelerator:
  _target_: accelerate.Accelerator
  dataloader_config:
    _target_: accelerate.DataLoaderConfiguration
    split_batches: true
dataset:
  Middlebury:
    outlier: 2
    instance:
      _target_: dataset.stereo_dataset.Middlebury
      root: /data/StereoData/middlebury
      year: MiddEval3
      split: training
      resolution: H
      mask: noc
dataloader:
  split: true
  batch_size_per_gpu: 1
  total_batch_size: null
  param:
    batch_size: null
    num_workers: null
    pin_memory: true
    shuffle: false
    drop_last: false
max_disp: 192
