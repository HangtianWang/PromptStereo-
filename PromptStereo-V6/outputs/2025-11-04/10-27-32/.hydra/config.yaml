model:
  name: PromptStereo
  train_iters: 16
  valid_iters: 32
  instance:
    _target_: model.promptstereo.PromptStereo
    cfg:
      feat_dim:
      - 64
      - 128
      - 192
      - 256
      stem_dim:
      - 32
      - 64
      - 128
      - 192
      - 256
      gwc_max_disp: 192
      gwc_group: 8
      corr_level: 2
      corr_radius: 4
      n_downsample: 2
      pretrained_model:
        name: DepthAnythingV2
        checkpoint: /data/wxq/checkpoint/depth_anything_v2/depth_anything_v2_vitl.pth
        features: 256
        out_channels:
        - 256
        - 512
        - 1024
        - 1024
        use_bn: false
        instance:
          _target_: model.depth_anything_v2.DepthAnythingV2
          encoder: vitl
          features: ${..features}
          out_channels: ${..out_channels}
          use_bn: false
          use_clstoken: false
seed: 666
gpus: ${oc.env:CUDA_VISIBLE_DEVICES, '0,1,2,3'}
accelerator:
  _target_: accelerate.Accelerator
  mixed_precision: bf16
  dataloader_config:
    _target_: accelerate.DataLoaderConfiguration
    split_batches: true
    use_seedable_sampler: true
  log_with: wandb
tracker:
  project_name: PromptStereo-V6
  init_kwargs:
    wandb:
      entity: windsrain
      name: exp14-0.5BD
train_set:
  SceneFlow:
    instance:
      _target_: dataset.stereo_dataset.SceneFlow
      aug_params:
        crop_size:
        - 384
        - 768
        color_jitter:
          brightness:
          - 0.6
          - 1.4
          contrast:
          - 0.6
          - 1.4
          saturation:
          - 0
          - 1.4
          hue: 0.5
          asymmetric_prob: 0.2
        random_erase:
          max_time: 2
          bound:
          - 50
          - 100
          prob: 0.5
        random_scale:
          min_scale: -0.2
          max_scale: 0.4
          max_stretch: 0.2
          stretch_prob: 0.8
          scale_prob: 0.5
        y_jitter: false
      root: /data/StereoData/sceneflow
      dstype: frames_finalpass
      things_test: false
      mask: all
valid_set:
  SceneFlow:
    outlier: 1
    instance:
      _target_: dataset.stereo_dataset.SceneFlow
      root: /data/StereoData/sceneflow
      dstype: frames_finalpass
      things_test: true
      mask: all
  KITTI:
    outlier: 3
    instance:
      _target_: dataset.stereo_dataset.KITTI
      root: /data/StereoData/kitti
      year: '2015'
      split: training
      mask: all
  Middlebury:
    outlier: 2
    instance:
      _target_: dataset.stereo_dataset.Middlebury
      root: /data/StereoData/middlebury
      split: training
      resolution: H
      mask: noc
  ETH3D:
    outlier: 1
    instance:
      _target_: dataset.stereo_dataset.ETH3D
      root: /data/StereoData/eth3d
      split: training
      mask: noc
train_loader:
  split: false
  batch_size_per_gpu: null
  total_batch_size: 8
  param:
    batch_size: null
    num_workers: null
    pin_memory: true
    shuffle: true
    drop_last: true
valid_loader:
  split: true
  batch_size_per_gpu: 1
  total_batch_size: null
  param:
    batch_size: null
    num_workers: null
    pin_memory: true
    shuffle: false
    drop_last: false
optimizer:
  _target_: torch.optim.AdamW
  lr: 0.0002
scheduler:
  _target_: torch.optim.lr_scheduler.OneCycleLR
  max_lr: 0.0002
  total_steps: 200000
  pct_start: 0.01
  cycle_momentum: false
  anneal_strategy: linear
max_disp: 192
max_norm: 1.0
save_freq: 10000
save_path: /data/wxq/checkpoint/promptstereo-v6/exp14-0.5BD
valid_freq: 10000
